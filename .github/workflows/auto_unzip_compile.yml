name: Auto Unzip & Compile STM32 Firmware (100% Pure Bare-Metal CMSIS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Newest Firmware ZIP if Present
        run: |
          NEWEST_ZIP=$(ls -t *.zip 2>/dev/null | head -n 1 || true)
          if [ -n "$NEWEST_ZIP" ]; then
            echo "Found newest ZIP archive: $NEWEST_ZIP - extracting into repository..."
            unzip -o "$NEWEST_ZIP" -d .
          fi

      - name: Apply Bare-Metal Boot, PC13 Boot Blink, Non-Recursive Memset & I2C1 Fixes
        run: |
          python3 - << 'EOF'
          import glob

          for h_path in glob.glob("**/baremetal_cmsis_stm32f103.h", recursive=True):
              with open(h_path, "r") as f:
                  h = f.read()
              h = h.replace('optimize("O2")', 'noinline, optimize("no-tree-loop-distribute-patterns")')
              h = h.replace('uint8_t *d = (uint8_t *)dst;', 'volatile uint8_t *d = (volatile uint8_t *)dst;')
              h = h.replace('const uint8_t *s = (const uint8_t *)src;', 'const volatile uint8_t *s = (const volatile uint8_t *)src;')
              h = h.replace('char *d = dst;', 'volatile char *d = (volatile char *)dst;')
              old_dwt = "uint32_t start = DWT->CYCCNT;\n    uint32_t ticks = (uint32_t)us * 72UL;\n    while ((uint32_t)(DWT->CYCCNT - start) < ticks) {}"
              new_sys = "if (us == 0U) return;\n    uint32_t reload = SysTick->LOAD;\n    if (reload == 0UL || (SysTick->CTRL & 1UL) == 0UL) { volatile uint32_t l = (uint32_t)us * 12UL; while (l--) { __asm volatile (\"nop\"); } return; }\n    uint32_t total = (uint32_t)us * 72UL, start = SysTick->VAL, el = 0UL;\n    while (el < total) { uint32_t now = SysTick->VAL; el += (now <= start) ? (start - now) : (reload + 1UL - now + start); start = now; }"
              h = h.replace(old_dwt, new_sys)
              if "bm_pc13_boot_blink" not in h:
                  blink_fn = "static void bm_pc13_boot_blink(int count, unsigned long ms_on, unsigned long ms_off) {\n    RCC->APB2ENR |= (1UL << 4);\n    GPIOC->CRH = (GPIOC->CRH & 0xFF0FFFFFUL) | 0x00200000UL;\n    for (int i = 0; i < count; i++) { GPIOC->BRR = (1UL << 13); bm_delay_ms(ms_on); GPIOC->BSRR = (1UL << 13); bm_delay_ms(ms_off); }\n}\nstatic void bm_system_clock_72mhz_init"
                  h = h.replace("static void bm_system_clock_72mhz_init", blink_fn, 1)
                  h = h.replace("bm_system_clock_72mhz_init();\n        __enable_irq();", "bm_system_clock_72mhz_init();\n        __enable_irq();\n        bm_pc13_boot_blink(3, 50UL, 50UL);", 1)
              with open(h_path, "w") as f:
                  f.write(h)

          for ld_path in glob.glob("**/stm32f103c6t6.ld", recursive=True):
              with open(ld_path, "r") as f:
                  ld = f.read()
              ld = ld.replace(".isr_vector :", ".isr_vector ORIGIN(FLASH) :")
              if "/DISCARD/" not in ld:
                  ld = ld[:-2] + "\n  /DISCARD/ : { *(.note*) *(.comment*) *(.eh_frame*) *(.ARM.attributes*) }\n}\n"
              with open(ld_path, "w") as f:
                  f.write(ld)

          for ino_path in glob.glob("**/*.ino", recursive=True):
              with open(ino_path, "r") as f:
                  c = f.read()
              old_w = "while (!(BM_I2C1->SR1 & ((1UL << 2) | (1UL << 7))) && --t) {}\n    BM_I2C1->CR1 |= (1UL << 9);"
              new_w = "while (!(BM_I2C1->SR1 & ((1UL << 2) | (1UL << 10))) && --t) {}\n    if (BM_I2C1->SR1 & (1UL << 10)) BM_I2C1->SR1 &= ~(1UL << 10);\n    BM_I2C1->CR1 |= (1UL << 9);\n    t = 36000UL;\n    while ((BM_I2C1->CR1 & (1UL << 9)) && --t) {}"
              c = c.replace(old_w, new_w).replace("uint32_t t = 4000UL;", "uint32_t t = 72000UL;")
              c = c.replace("return (nowCycles != 0) ? (nowCycles / 72UL) : bm_micros();", "return (uint32_t)bm_micros();")
              if "bm_delay_ms(60);" not in c and "bm_i2c1_init(100000UL);" in c:
                  c = c.replace("bm_i2c1_init(100000UL);", "bm_delay_ms(60);\n    bm_i2c1_init(100000UL);", 1)
              old_sp = "            IWDG_FEED();\n            bm_delay_ms(100);\n        }"
              new_sp = "            if ((i & 1) == 0) STATUS_LED_ON();\n            else              STATUS_LED_OFF();\n            IWDG_FEED();\n            bm_delay_ms(100);\n        }\n        STATUS_LED_OFF();"
              if "if ((i & 1) == 0) STATUS_LED_ON();" not in c and old_sp in c:
                  c = c.replace(old_sp, new_sp, 1)
              with open(ino_path, "w") as f:
                  f.write(c)
          EOF

      - name: Run 11 Host C++ Verification Test Suites
        run: |
          if [ -f "tests/run_tests.sh" ]; then
            chmod +x tests/run_tests.sh
            ./tests/run_tests.sh
          fi

      - name: Install Pure ARM Bare-Metal Toolchain (gcc-arm-none-eabi)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Compile 100% Pure Freestanding Bare-Metal Firmware (STM32F103C6T6 32KB & C8T6 64KB)
        run: |
          mkdir -p build_output

          INO_FILE=$(find . -name "*.ino" | head -n 1)
          HEADER_FILE=$(find . -name "baremetal_cmsis_stm32f103.h" | head -n 1)
          LD_FILE=$(find . -name "stm32f103c6t6.ld" | head -n 1)

          cp "$INO_FILE" build_output/firmware_baremetal.cpp
          cp "$HEADER_FILE" build_output/
          cp "$LD_FILE" build_output/

          arm-none-eabi-g++ \
            -mcpu=cortex-m3 -mthumb \
            -Os -flto -fno-tree-loop-distribute-patterns \
            -ffunction-sections -fdata-sections \
            -fno-exceptions -fno-rtti -fno-use-cxa-atexit -fno-threadsafe-statics \
            -nostdlib -nostartfiles \
            -DPURE_BAREMETAL_BUILD -DSTM32F103x6 \
            -Ibuild_output -Iinclude -Isrc \
            -T build_output/stm32f103c6t6.ld \
            -Wl,--gc-sections -Wl,--build-id=none -Wl,-u,g_pfnVectors \
            -Wl,-Map=build_output/STM32_Zipper_CNC_V17_1_0_Firmware.map \
            build_output/firmware_baremetal.cpp \
            -lgcc -o build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf

          arm-none-eabi-objcopy -O binary build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin
          arm-none-eabi-objcopy -O ihex build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf build_output/STM32_Zipper_CNC_V17_1_0_Firmware.hex

          echo "=== CORTEX-M3 VECTOR TABLE CHECK (@ 0x08000000) ==="
          od -tx4 -N 16 build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin
          FIRST_WORD=$(od -An -tx4 -N 4 build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin | tr -d ' ')
          echo "Initial MSP at 0x08000000: 0x${FIRST_WORD} (Expected: 0x20002800)"
          if [ "$FIRST_WORD" != "20002800" ]; then
            echo "ERROR: Vector table is NOT at 0x08000000! Got 0x${FIRST_WORD}"
            exit 1
          fi

          echo "=== PURE BARE-METAL MEMORY USAGE REPORT ==="
          arm-none-eabi-size -B build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf
          BIN_SIZE=$(stat -c%s build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin)
          echo "Pure Bare-Metal Binary Size: ${BIN_SIZE} bytes (Limit: 31744 bytes)"
          if [ "$BIN_SIZE" -gt 31744 ]; then
            exit 1
          fi

      - name: Upload Compiled Firmware Artifacts (.bin / .hex / .elf)
        uses: actions/upload-artifact@v4
        with:
          name: STM32_Zipper_CNC_V17_1_0_Compiled_Binaries
          path: |
            build_output/*.bin
            build_output/*.hex
            build_output/*.elf
            build_output/*.map
            
