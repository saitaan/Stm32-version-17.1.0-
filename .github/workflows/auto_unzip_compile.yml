name: Auto Unzip & Compile STM32 Firmware (100% Pure Bare-Metal CMSIS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto-Extract Firmware ZIP if Present
        run: |
          if [ -f "STM32_Firmware.zip" ]; then
            echo "Found STM32_Firmware.zip - extracting into repository..."
            unzip -o STM32_Firmware.zip -d .
          elif [ -f "STM32_Zipper_CNC_V17_1_0_Complete_Project.zip" ]; then
            echo "Found STM32_Zipper_CNC_V17_1_0_Complete_Project.zip - extracting into repository..."
            unzip -o STM32_Zipper_CNC_V17_1_0_Complete_Project.zip -d .
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found $ZIP_FILE - extracting into repository..."
              unzip -o "$ZIP_FILE" -d .
            fi
          fi

      - name: Run 11 Host C++ Verification Test Suites
        run: |
          if [ -f "tests/run_tests.sh" ]; then
            chmod +x tests/run_tests.sh
            ./tests/run_tests.sh
          fi

      - name: Install Pure ARM Bare-Metal Toolchain (gcc-arm-none-eabi)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Compile 100% Pure Freestanding Bare-Metal Firmware (STM32F103C6T6 32KB & C8T6 64KB)
        run: |
          mkdir -p build_output

          INO_FILE=$(find . -name "*.ino" | head -n 1)
          HEADER_FILE=$(find . -name "baremetal_cmsis_stm32f103.h" | head -n 1)
          LD_FILE=$(find . -name "stm32f103c6t6.ld" | head -n 1)

          echo "Found INO: $INO_FILE"
          echo "Found Header: $HEADER_FILE"
          echo "Found Linker Script: $LD_FILE"

          cp "$INO_FILE" build_output/firmware_baremetal.cpp
          if [ -n "$HEADER_FILE" ]; then cp "$HEADER_FILE" build_output/; fi
          if [ -n "$LD_FILE" ]; then cp "$LD_FILE" build_output/; fi

          arm-none-eabi-g++ \
            -mcpu=cortex-m3 -mthumb \
            -Os -flto -ffunction-sections -fdata-sections \
            -fno-exceptions -fno-rtti -fno-use-cxa-atexit -fno-threadsafe-statics \
            -nostdlib -nostartfiles \
            -DPURE_BAREMETAL_BUILD -DSTM32F103x6 \
            -Ibuild_output -Iinclude -Isrc \
            -T build_output/stm32f103c6t6.ld \
            -Wl,--gc-sections -Wl,--build-id=none -Wl,-u,g_pfnVectors \
            -Wl,-Map=build_output/STM32_Zipper_CNC_V17_1_0_Firmware.map \
            build_output/firmware_baremetal.cpp \
            -lgcc -o build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf

          arm-none-eabi-objcopy -O binary build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin
          arm-none-eabi-objcopy -O ihex build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf build_output/STM32_Zipper_CNC_V17_1_0_Firmware.hex

          echo "=== CORTEX-M3 VECTOR TABLE CHECK (@ 0x08000000) ==="
          od -tx4 -N 16 build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin
          FIRST_WORD=$(od -An -tx4 -N 4 build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin | tr -d ' ')
          echo "Initial MSP at 0x08000000: 0x${FIRST_WORD} (Expected: 0x20002800)"
          if [ "$FIRST_WORD" != "20002800" ]; then
            echo "ERROR: Vector table is NOT at 0x08000000! Got 0x${FIRST_WORD}"
            exit 1
          fi

          echo "=== PURE BARE-METAL MEMORY USAGE REPORT ==="
          arm-none-eabi-size -A build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf
          arm-none-eabi-size -B build_output/STM32_Zipper_CNC_V17_1_0_Firmware.elf
          ls -lh build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin build_output/STM32_Zipper_CNC_V17_1_0_Firmware.hex

          BIN_SIZE=$(stat -c%s build_output/STM32_Zipper_CNC_V17_1_0_Firmware.bin)
          echo "Pure Bare-Metal Binary Size: ${BIN_SIZE} bytes (Limit: 31744 bytes for 32KB STM32F103C6T6 with Page 31 EEPROM)"
          if [ "$BIN_SIZE" -gt 31744 ]; then
            echo "ERROR: Binary exceeds 31KB Flash limit!"
            exit 1
          fi
          echo "SUCCESS: 100% Pure C/CMSIS Bare-Metal Firmware verified & fits inside 32KB STM32F103C6T6!"

      - name: Upload Compiled Firmware Artifacts (.bin / .hex / .elf)
        uses: actions/upload-artifact@v4
        with:
          name: STM32_Zipper_CNC_V17_1_0_Compiled_Binaries
          path: |
            build_output/*.bin
            build_output/*.hex
            build_output/*.elf
            build_output/*.map
